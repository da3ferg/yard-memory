name: Update Yard Memory

on:
  schedule:
    # Every 4 hours. 05:17 UTC is 12:17 AM in Kingston.
    - cron: "17 1,5,9,13,17,21 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", ".github/workflows/update.yml", "package*.json"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: yard-memory-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_AWS_KEYS: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # Claude runs on Amazon Bedrock. Pick one way to sign in to AWS:
      # a role assumed through GitHub OIDC (recommended, no stored keys)...
      - name: Sign in to AWS (OIDC role)
        if: vars.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # ...or stored access keys.
      - name: Sign in to AWS (access keys)
        if: vars.AWS_ROLE_ARN == '' && env.HAS_AWS_KEYS == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Read the news and rank this week
        run: node src/run.js
        env:
          # Without AWS, stories use the outlets' own headlines and summaries.
          BEDROCK_MODEL: ${{ vars.BEDROCK_MODEL || 'anthropic.claude-opus-5-5' }}
          # Optional. Without it, the X section is left out.
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          X_QUERY: ${{ vars.X_QUERY }}
          MAX_STORIES: ${{ vars.MAX_STORIES || '30' }}

      - name: Save this week to the archive
        run: |
          git config user.name "yard-memory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

      - name: Build the site
        run: node src/build.js
        env:
          SHOW_PUBLISHER_IMAGES: ${{ vars.SHOW_PUBLISHER_IMAGES || 'true' }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
